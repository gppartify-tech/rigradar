# RigRadar - the whole stack with one command:
#     cp .env.example .env      (then edit it)
#     docker compose up --build
# Website:        http://localhost:8080
# API docs:       http://localhost:8000/docs
# Test inbox:     http://localhost:8025   (price-alert e-mails land here)

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://rigradar:rigradar@db:5432/rigradar
    REDIS_URL: redis://redis:6379/0
    SMTP_HOST: ${SMTP_HOST:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
    SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
  volumes:
    - uploads:/app/uploads
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rigradar
      POSTGRES_PASSWORD: rigradar
      POSTGRES_DB: rigradar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rigradar"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Fake mail server for development: shows every e-mail the app sends.
  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - "8025:8025"

  # FastAPI. On start it runs the database migrations and the seed (stores, admin, demo data).
  api:
    <<: *backend
    command: >
      sh -c "python3 -m app.cli init &&
             python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"
    ports:
      - "8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Celery worker: runs the Playwright scrapers and sends the alert e-mails.
  worker:
    <<: *backend
    command: python3 -m celery -A app.celery_app worker -Q scraping,default -c 2 -l info
    shm_size: "1gb"   # Chromium needs more shared memory than Docker's 64 MB default
    depends_on:
      api: { condition: service_started }

  # Celery beat: the clock that queues a scrape every SCRAPE_INTERVAL_HOURS.
  beat:
    <<: *backend
    command: python3 -m celery -A app.celery_app beat -l info --schedule /tmp/celerybeat-schedule
    depends_on:
      worker: { condition: service_started }

  # React app served by nginx (also proxies /api and /uploads to the API).
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
