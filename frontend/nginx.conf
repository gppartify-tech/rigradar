server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # marketplace photo uploads (the API limits images to 5 MB)
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # the AI assistant can take a while to answer
    }

    location /uploads/ {
        proxy_pass http://api:8000;
        expires 7d;
    }

    # hashed build files never change -> cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # single page app: every other URL is handled by React Router
    location / {
        try_files $uri /index.html;
    }
}
